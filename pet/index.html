<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宠物直播案例 · 扫码观看</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
  :root {
    --paper: #F6F1E9;
    --ink: #241C15;
    --muted: #8A7F70;
    --line: #E6DCCE;
    --card: #FFFFFF;
    --accent: #E2763C;
    --accent2: #8A6A45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* ===== 页头 ===== */
  header { padding: 44px 4px 28px; text-align: left; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--muted);
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,0.6);
  }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 900; font-size: 30px; line-height: 1.3;
    margin-top: 16px; letter-spacing: 0.01em;
  }
  .sub { margin-top: 8px; color: var(--muted); font-size: 14px; }

  /* ===== 案例卡片 ===== */
  .case {
    margin-top: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(36,28,21,0.06);
  }
  .stage { position: relative; background: #14100C; }
  video { display: block; width: 100%; aspect-ratio: 0.562; object-fit: contain; background: #14100C; }
  video.is-second { aspect-ratio: 0.461; }
  .play {
    position: absolute; inset: 0; margin: auto;
    width: 72px; height: 72px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff; background: var(--accent);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    transition: transform 0.18s ease, opacity 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .play svg { width: 28px; height: 28px; margin-left: 3px; }
  .play:active { transform: scale(0.92); }
  .play.hidden { opacity: 0; pointer-events: none; }
  .case.is-second .play { background: var(--accent2); }

  .info { padding: 16px 18px 18px; }
  .info-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .case.is-first .dot { background: var(--accent); }
  .case.is-second .dot { background: var(--accent2); }
  h2 { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-weight: 600; font-size: 20px; }
  .duration {
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; flex: none;
  }
  .desc { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 12px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px;
  }


  /* ===== 联系我 ===== */
  .contact {
    margin-top: 36px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(36,28,21,0.06);
    text-align: center;
    padding: 26px 20px 28px;
  }
  .contact h3 { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; font-weight: 600; font-size: 19px; }
  .contact .c-sub { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .contact img {
    display: block; width: 190px; height: auto; margin: 18px auto 0;
    border-radius: 14px; border: 1px solid var(--line);
    background: #fff;
  }
  .contact .c-hint {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px;
  }
  .contact .c-hint::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .contact .c-tip { margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* ===== 页脚 ===== */
  footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .play { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">AI 宠物直播案例</span>
    <h1>直播案例精选</h1>
    <p class="sub">ACANA 爱肯拿宠物食品直播间实录，点击播放即可观看。</p>
  </header>

  <section class="case is-first">
    <div class="stage">
      <video class="is-first" controls playsinline preload="metadata" poster="pet1_poster.jpg"
             src="pet1.mp4"></video>
      <button class="play" type="button" aria-label="播放案例视频">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .81.88 1.31 1.57.89l10.8-6.86a1.05 1.05 0 0 0 0-1.78L9.57 4.25A1.04 1.04 0 0 0 8 5.14Z"/></svg>
      </button>
    </div>
    <div class="info">
      <div class="info-top">
        <div class="brand"><span class="dot"></span><h2>ACANA 爱肯拿</h2></div>
        <span class="duration">00:18</span>
      </div>
      <p class="desc">直播间弹幕智能回复实录 · 精准识别咨询、秒级回复。</p>
      <div class="tags"><span class="tag">宠物直播</span><span class="tag">弹幕互动</span></div>
    </div>
  </section>

  <section class="case is-second">
    <div class="stage">
      <video class="is-second" controls playsinline preload="metadata" poster="pet2_poster.jpg"
             src="pet2.mp4"></video>
      <button class="play" type="button" aria-label="播放案例视频">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .81.88 1.31 1.57.89l10.8-6.86a1.05 1.05 0 0 0 0-1.78L9.57 4.25A1.04 1.04 0 0 0 8 5.14Z"/></svg>
      </button>
    </div>
    <div class="info">
      <div class="info-top">
        <div class="brand"><span class="dot"></span><h2>ACANA 爱肯拿</h2></div>
        <span class="duration">00:44</span>
      </div>
      <p class="desc">直播间商品选购操作实录 · 讲解与商品列表无缝切换。</p>
      <div class="tags"><span class="tag">宠物直播</span><span class="tag">商品讲解</span></div>
    </div>
  </section>


  <section class="contact">
    <h3>添加微信，获取更多行业案例</h3>
    <p class="c-sub">看完案例后，长按识别下方二维码添加好友</p>
    <img src="wechat_contact.png" alt="微信二维码" loading="lazy">
    <span class="c-hint">长按识别二维码 · 添加我为好友</span>
    <p class="c-tip">建议在微信内打开本页后长按识别</p>
  </section>

  <footer>AI 宠物直播案例展示 · 建议使用手机全屏观看</footer>
</div>

<script>
  (function () {
    var stages = document.querySelectorAll('.stage');
    Array.prototype.forEach.call(stages, function (stage) {
      var video = stage.querySelector('video');
      var play = stage.querySelector('.play');
      play.addEventListener('click', function () {
        var p = video.play();
        if (p && p.catch) { p.catch(function () {}); }
      });
      video.addEventListener('play', function () { play.classList.add('hidden'); });
      video.addEventListener('pause', function () { play.classList.remove('hidden'); });
      video.addEventListener('ended', function () { play.classList.remove('hidden'); });
    });
  })();
</script>
</body>
</html>
